name: Build and test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Booker/Booker.sln

      - name: Build
        run: dotnet build Booker/Booker.sln --no-restore --nologo

      - name: Test
        run: dotnet test Booker/Booker.sln --no-build --nologo

  # E2E is not part of the solution: it needs a real browser, so it runs as its
  # own job.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Booker.E2e/Booker.E2e.csproj

      - name: Build
        run: dotnet build Booker.E2e/Booker.E2e.csproj --no-restore --nologo

      - name: Install Chromium for Playwright
        run: pwsh Booker.E2e/bin/Debug/net8.0/playwright.ps1 install --with-deps chromium

      - name: E2E tests
        run: dotnet test Booker.E2e/Booker.E2e.csproj --no-build --nologo
