name: Build and Deploy (.NET 9.0)

on:
  push:
    branches:
      - release  # Trigger workflow on push to the release branch

permissions:
  contents: read   # Required to checkout the repo

jobs:
  build-deploy:
    runs-on: windows-latest  # Use Windows runner for Windows hosting
    env:
      DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
      STORAGE_CONNECTION_STRING: ${{ secrets.STORAGE_CONNECTION_STRING }}
      STORAGE_CONTAINER_NAME: ${{ secrets.STORAGE_CONTAINER_NAME }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      MSDEPLOY_SERVICE_URL: ${{ secrets.MSDEPLOY_SERVICE_URL }}
      MSDEPLOY_USERNAME: ${{ secrets.MSDEPLOY_USERNAME }}
      MSDEPLOY_PASSWORD: ${{ secrets.MSDEPLOY_PASSWORD }}
      MSDEPLOY_IIS_APP_PATH: ${{ secrets.MSDEPLOY_IIS_APP_PATH }}

    steps:
      # 1. Checkout code
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          ref: release  # Ensure the workflow runs on the release branch

      # 2. Setup .NET SDK
      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: |
            9.0.x

      # 3. Restore dependencies
      - name: Restore Dependencies
        shell: pwsh
        run: dotnet restore .\Booker\Booker.sln

      # 4. Replace configuration tokens in appsettings.json
      - name: Replace configuration tokens in appsettings.json
        shell: pwsh
        run: |
          $filePath = ".\Booker\appsettings.json"
          (Get-Content $filePath -Raw) `
            -replace '\{#db-connection-string#\}', "$env:DB_CONNECTION_STRING" `
            -replace '\{#storage-connection-string#\}', "$env:STORAGE_CONNECTION_STRING" `
            -replace '\{#container-name#\}', "$env:STORAGE_CONTAINER_NAME" `
            -replace '\{smtp-username\}', "$env:SMTP_USERNAME" `
            -replace '#\{smtp-password\}#', "$env:SMTP_PASSWORD" |
            Set-Content $filePath

      # 5. Build and Deploy
      - name: Build and Deploy
        shell: pwsh
        run: |
          dotnet build .\Booker\Booker.sln `
            /p:Configuration=Release `
            /p:DeployOnBuild=True `
            /p:WebPublishMethod=MSDeploy `
            /p:MSDeployPublishMethod=WMSVC `
            "/p:MSDeployServiceUrl=$env:MSDEPLOY_SERVICE_URL" `
            "/p:UserName=$env:MSDEPLOY_USERNAME" `
            "/p:Password=$env:MSDEPLOY_PASSWORD" `
            "/p:DeployIISAppPath=$env:MSDEPLOY_IIS_APP_PATH" `
            /p:SkipExtraFilesOnServer=False `
            /p:OutputPath=".\Booker\build_artifacts"
