name: Build and Deploy (.NET 9.0) with OIDC Debugging

on:
  push:
    branches:
      - release  # Trigger workflow on push to the release branch

permissions:
  id-token: write  # Required for OIDC authentication
  contents: read   # Required to checkout the repo

jobs:
  build-deploy:
    runs-on: windows-latest  # Use Windows runner for Windows hosting
    env:
      # The production connection string comes straight from the secret, so certificate
      # validation depends on its content: it must use Encrypt=True and never set
      # TrustServerCertificate=True (that bypass stays dev-only in appsettings.Development.json).
      DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
      CLOUDFLARE_R2_SERVICE_URL: ${{ secrets.CLOUDFLARE_R2_SERVICE_URL }}
      CLOUDFLARE_R2_PUBLIC_URL: ${{ secrets.CLOUDFLARE_R2_PUBLIC_URL }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
      MAINTENANCE: ${{ secrets.MAINTENANCE }}
      TESTING_PHASE: ${{ secrets.TESTING_PHASE }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      MSDEPLOY_SERVICE_URL: ${{ secrets.MSDEPLOY_SERVICE_URL }}
      MSDEPLOY_USERNAME: ${{ secrets.MSDEPLOY_USERNAME }}
      MSDEPLOY_PASSWORD: ${{ secrets.MSDEPLOY_PASSWORD }}
      MSDEPLOY_IIS_APP_PATH: ${{ secrets.MSDEPLOY_IIS_APP_PATH }}

    steps:
      # 1. Checkout code
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          ref: release  # Ensure the workflow runs on the release branch

      # 2. Fail the deploy if the secret disables certificate validation
      - name: Validate DB connection string encryption settings
        shell: pwsh
        run: |
          if ($env:DB_CONNECTION_STRING -match 'TrustServerCertificate\s*=\s*(true|yes)') {
            Write-Host "::error::DB_CONNECTION_STRING must not disable encryption (TrustServerCertificate)"
            exit 1
          }
          if ($env:DB_CONNECTION_STRING -match 'Encrypt\s*=\s*false') {
            Write-Host "::error::DB_CONNECTION_STRING must not disable encryption (Encrypt=False)"
            exit 1
          }

      # 3. Setup .NET SDK
      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: |
            9.0.x

      # 5. Restore dependencies
      - name: Restore Dependencies
        shell: pwsh
        run: dotnet restore .\Booker\Booker.sln

      # 6. Replace DB connection string token in appsettings.json
      - name: Replace db_connection_string token in appsettings.json
        shell: pwsh
        run: |
          $filePath = ".\Booker\appsettings.json"
            (Get-Content $filePath -Raw) `
            -replace '\{#db-connection-string#\}', "$env:DB_CONNECTION_STRING" `
            -replace '\{#cloudflare-r2-service-url#\}', "$env:CLOUDFLARE_R2_SERVICE_URL" `
            -replace '\{#cloudflare-r2-public-url#\}', "$env:CLOUDFLARE_R2_PUBLIC_URL" `
            -replace '\{#cloudflare-r2-access-key-id#\}', "$env:CLOUDFLARE_R2_ACCESS_KEY_ID" `
            -replace '\{#cloudflare-r2-secret-access-key#\}', "$env:CLOUDFLARE_R2_SECRET_ACCESS_KEY" `
            -replace '\{#cloudflare-r2-bucket-name#\}', "$env:CLOUDFLARE_R2_BUCKET_NAME" `
            -replace '\{#maintenance#\}', "$env:MAINTENANCE" `
            -replace '\{#testing-phase#\}', "$env:TESTING_PHASE" `
            -replace '\{smtp-username\}', "$env:SMTP_USERNAME" `
            -replace '#\{smtp-password\}#', "$env:SMTP_PASSWORD" |
            Set-Content $filePath
          
      - name: Build and Deploy
        shell: pwsh
        run: |
          $publishProfilePath = ".\Booker\Properties\PublishProfiles\GitHubActions.pubxml"
          New-Item -ItemType Directory -Force (Split-Path $publishProfilePath) | Out-Null

          @"
          <Project>
            <PropertyGroup>
              <WebPublishMethod>MSDeploy</WebPublishMethod>
              <MSDeployPublishMethod>WMSVC</MSDeployPublishMethod>
              <MSDeployServiceUrl>$([System.Security.SecurityElement]::Escape($env:MSDEPLOY_SERVICE_URL))</MSDeployServiceUrl>
              <UserName>$([System.Security.SecurityElement]::Escape($env:MSDEPLOY_USERNAME))</UserName>
              <Password>$([System.Security.SecurityElement]::Escape($env:MSDEPLOY_PASSWORD))</Password>
              <DeployIISAppPath>$([System.Security.SecurityElement]::Escape($env:MSDEPLOY_IIS_APP_PATH))</DeployIISAppPath>
              <SkipExtraFilesOnServer>False</SkipExtraFilesOnServer>
            </PropertyGroup>
          </Project>
          "@ | Set-Content $publishProfilePath

          try {
            dotnet build .\Booker\Booker.sln /p:Configuration=Release /p:DeployOnBuild=True /p:PublishProfile=GitHubActions /p:OutputPath=".\Booker\build_artifacts"
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }
          finally {
            Remove-Item $publishProfilePath -Force -ErrorAction SilentlyContinue
          }
        
